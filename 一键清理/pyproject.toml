[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yi-jian-qing-li"
version = "0.1.0"
description = "A local-first Windows desktop file organizer"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = ["PySide6==6.12.0"]

[project.scripts]
yi-jian-qing-li = "file_organizer.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_organizer = ["qml/*.qml"]

[tool.unittest]
start-directory = "tests"
